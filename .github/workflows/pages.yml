name: docs

# Build the static documentation site from the repo's Markdown and publish it
# to GitHub Pages. The build itself is `bun run docs:build` (see
# scripts/build-docs.ts); the artifact is the generated `site/` directory.
#
# First run: Settings → Pages → Source: "GitHub Actions" (configure-pages can
# also enable it when the token is allowed to).

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - 'scripts/build-docs.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run docs:build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
