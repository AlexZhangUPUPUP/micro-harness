name: CI

on:
  push:
    branches: [main, platform]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bunx tsc -p scripts/evals/tsconfig.json --noEmit
      - run: bun run eval:mock
      - run: bun run docs:build
      - run: cd packages/gui && bun run build

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # GitHub runners restrict unprivileged user namespaces on newer images;
      # the test skips itself if bwrap still cannot start, so this never lies.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: bun test packages/core/test/sandbox.test.ts
