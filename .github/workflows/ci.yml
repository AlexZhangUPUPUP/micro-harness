name: CI

on:
  push:
    branches: [main, platform]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test
      - run: bun run typecheck
      - run: bunx tsc -p scripts/evals/tsconfig.json --noEmit
      - run: bun run eval:mock
      - run: bun run docs:build
      - run: cd packages/gui && bun run build
